# CI GitHub (PRD 2.1, checklist F5, contrôle C04) : rejoue sur les serveurs de
# GitHub tous les contrôles du crochet avant commit, plus CodeQL, l'audit des
# dépendances, les en-têtes du site (C05, C06), les secrets dans les fichiers
# publiés (C01), l'alignement des documents et les empreintes des skills (C07,
# C08), et les tests des contrôles eux-mêmes (tests/). Aucune fusion dans main
# sans ces contrôles au vert.
# Actions figées par empreinte de commit (mises à jour par Dependabot, relues).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Chaque lundi : nouvelles failles publiées entre-temps (dépendances, CodeQL).
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Seuls les passages d'une demande de fusion remplacée sont annulés ; un passage
  # de main en cours n'est jamais interrompu (un passage en attente peut être
  # remplacé par un plus récent, comportement de GitHub).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # « bash » seul ajoute pipefail : une commande en échec dans un enchaînement fait échouer l'étape.
    shell: bash

env:
  # Télémétrie de Next.js désactivée (PRD 6.2).
  NEXT_TELEMETRY_DISABLED: "1"
  # gitleaks : version et empreinte en un seul endroit de la CI (jobs Qualité et
  # Secrets). Le crochet .githooks/_commun.sh en a une copie : les changer ensemble.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  qualite:
    name: Qualité
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Crochets git présents et exécutables
        run: |
          # Un crochet absent ou non exécutable est ignoré par git sans échec.
          bad="$(git ls-files -s .githooks | awk '$4 != ".githooks/_commun.sh" && $1 != "100755" {print $4}')"
          if [ -n "$bad" ]; then
            echo "::error::Crochets non exécutables : $bad"
            exit 1
          fi
          # Chaque crochet attendu existe, charge _commun.sh et appelle ses scans
          # (un crochet supprimé ou vidé ne donne pas un contrôle vert). Contrôle
          # du texte seulement : un « exit 0 » placé avant les scans n'est pas vu
          # ici ; les crochets restent des fichiers de contrôle signalés (C04).
          for crochet in pre-commit pre-push; do
            if [ -z "$(git ls-files ".githooks/$crochet")" ] \
              || ! grep -qxF '. "$(dirname "$0")/_commun.sh"' ".githooks/$crochet"; then
              echo "::error::Crochet absent ou sans les contrôles communs : $crochet"
              exit 1
            fi
            for appel in verifier_gitleaks preparer_config scanner_git scanner_diff; do
              if ! grep -qE "^[[:space:]]*${appel}( |$)" ".githooks/$crochet"; then
                echo "::error::$crochet n'appelle plus $appel"
                exit 1
              fi
            done
          done
          if [ -z "$(git ls-files .githooks/pre-merge-commit .githooks/_commun.sh | sed -n 2p)" ] \
            || ! grep -qxF 'exec "$(dirname "$0")/pre-commit"' .githooks/pre-merge-commit; then
            echo "::error::pre-merge-commit ou _commun.sh absent, ou pre-merge-commit sans pre-commit"
            exit 1
          fi
      # La mémoire de Claude (hors dépôt) est annoncée « non vérifiée ici » :
      # elle est contrôlée en D1 et F6 sur l'ordinateur.
      - name: Documents alignés sur le PRD, skills conformes (C07, C08)
        run: node scripts/verifier-alignement.mjs
      - name: Dépendances à l'identique (scripts d'installation bloqués par .npmrc)
        run: npm ci
      # Outils appelés directement, pas par les scripts de package.json :
      # une modification de ces scripts ne peut pas vider les contrôles.
      - name: Mise en forme
        run: ./node_modules/.bin/prettier --check .
      - name: Qualité du code
        run: ./node_modules/.bin/eslint --max-warnings=0
      - name: Types
        run: ./node_modules/.bin/next typegen && ./node_modules/.bin/tsc --noEmit
      - name: Compilation
        run: ./node_modules/.bin/next build
      - name: Interdiction d'indexation et en-têtes de sécurité (C05, C06)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verifier-entetes.mjs
      - name: Installation de gitleaks (empreinte vérifiée)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Aucun secret dans les fichiers publiés (C01)
        run: |
          # Fichiers publiés (code envoyé aux navigateurs, pages HTML, données et
          # code serveur des pages préparées à l'avance, public/), tels que compilés
          # par la CI : la compilation de Netlify, avec ses propres réglages, n'est
          # pas celle-ci (voir C59 au Lot 4). Tout le contenu passe par l'entrée
          # standard (aucune exclusion par nom de fichier), règles par défaut de
          # gitleaks, sans exception du dépôt.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-defaut.toml"
          dossiers=(.next/static .next/server/app)
          if [ -d public ]; then dossiers+=(public); fi
          find "${dossiers[@]}" -type f -print0 | xargs -0 cat > "$RUNNER_TEMP/publies.txt"
          # Rien à lire ne doit jamais donner un scan vert.
          if [ ! -s "$RUNNER_TEMP/publies.txt" ]; then
            echo "::error::Aucun fichier publié trouvé à scanner"
            exit 1
          fi
          gitleaks stdin --redact --no-banner --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-defaut.toml" --gitleaks-ignore-path "$RUNNER_TEMP" \
            < "$RUNNER_TEMP/publies.txt"
      - name: Même version de npm pour Netlify et le projet
        run: |
          projet="$(node -p 'require("./package.json").packageManager')"
          netlify="npm@$(sed -n 's/^ *NPM_VERSION = "\(.*\)"$/\1/p' netlify.toml)"
          if [ "$projet" != "$netlify" ]; then
            echo "::error::package.json ($projet) et netlify.toml ($netlify) diffèrent"
            exit 1
          fi
      # Les contrôles eux-mêmes (scripts/, crochets, et les étapes de cette CI
      # rejouées par tests/ci.test.mjs), lancés sur des copies jetables piégées :
      # chaque contournement prévu par les tests doit être refusé, chaque cas
      # normal accepté (limites connues : voir chaque contrôle). Après
      # l'installation de gitleaks, dont ces tests ont besoin. Rien à lire ne
      # donne jamais un contrôle vert : aucun test lu, ou un test sauté ou laissé
      # « à faire », est un échec.
      - name: Tests des contrôles
        run: |
          node --test --test-reporter=spec --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            "tests/**/*.test.mjs" | tee "$RUNNER_TEMP/tests.log"
          if ! grep -Eq '^ℹ tests [1-9]' "$RUNNER_TEMP/tests.log" \
            || ! grep -qx 'ℹ skipped 0' "$RUNNER_TEMP/tests.log" \
            || ! grep -qx 'ℹ todo 0' "$RUNNER_TEMP/tests.log"; then
            echo "::error::Tests des contrôles : aucun test lu, ou des tests sautés ou à faire"
            exit 1
          fi

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installation de gitleaks (empreinte vérifiée)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Tout l'historique, sans exception ajoutée par la demande de fusion
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -n "$(git ls-files -- '*.gitleaksignore' '.gitleaksignore')" ]; then
            echo "::error::Fichier .gitleaksignore interdit (exceptions aux secrets)"
            exit 1
          fi
          # Un .gitattributes (« -diff », « binary ») ne peut pas cacher un secret à ce
          # scan (réglage local prioritaire sur .gitattributes). Un fichier contenant un
          # octet nul reste ignoré par ce scan : l'étape suivante le lit (--text), testé
          # par tests/ci.test.mjs.
          attrs="$(git rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$attrs")"
          printf '* diff\n' > "$attrs"
          cfg="$RUNNER_TEMP/gitleaks"
          mkdir -p "$cfg"
          # Configuration de la branche de destination : une demande de fusion
          # ne peut pas élargir ses propres exceptions. Nom complet : une étiquette
          # ou une branche nommée « origin/main » ne peut pas la remplacer.
          git show "refs/remotes/origin/${BASE_REF}:.gitleaks.toml" > "$cfg/config.toml"
          # Deux témoins, faits d'un faux jeton GitHub créé à l'instant (jamais écrit
          # ni affiché), chacun doit être détecté, sinon la configuration est
          # inopérante (vidée, règle désactivée, exception trop large). Code 42 =
          # détecté ; 0 = non détecté ; autre = gitleaks en erreur (configuration
          # illisible), qui ne doit pas passer pour une détection. Mêmes témoins que
          # les crochets (.githooks/_commun.sh) :
          # 1. le jeton seul, que seule la règle des jetons GitHub reconnaît (écrit
          #    « token = … », une règle générique le détecterait même si celle-ci
          #    était désactivée) ;
          # 2. le même jeton dans une ligne de code ordinaire (une exception qui
          #    écarte toute ligne de code le laisserait passer).
          # Limite : les témoins ne prouvent ni que les autres règles sont actives, ni
          # que les exceptions visant un fichier sont étroites (revues à la fusion).
          # Testé par tests/ci.test.mjs.
          temoin="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36 || true)"
          for ligne in "$temoin" "export const cle = \"$temoin\";"; do
            code=0
            printf '%s\n' "$ligne" \
              | gitleaks stdin --no-banner --exit-code 42 --config "$cfg/config.toml" >/dev/null 2>&1 \
              || code=$?
            if [ "$code" -eq 0 ]; then
              echo "::error::Configuration gitleaks inopérante : un jeton témoin n'est pas détecté"
              exit 1
            elif [ "$code" -ne 42 ]; then
              echo "::error::gitleaks en erreur (code $code) : configuration illisible ?"
              exit 1
            fi
          done
          # Fusions comprises : le contenu ajouté en résolvant un conflit est scanné.
          # gitleaks rend 0 quand git échoue en dessous : une ligne « ERR » ou
          # aucun commit scanné est un échec (journal affiché, valeurs masquées).
          # Ici (--all, tout l'historique), au moins un commit ajoute du contenu ;
          # les crochets, qui ne scannent que quelques commits, ne l'exigent pas.
          gitleaks git --redact --no-banner --ignore-gitleaks-allow \
            --log-opts="--all --full-history --diff-merges=first-parent" \
            --config "$cfg/config.toml" --gitleaks-ignore-path "$cfg" . 2>&1 \
            | tee "$RUNNER_TEMP/historique.log"
          scannes="$(grep -Eo '[0-9]+ commits scanned' "$RUNNER_TEMP/historique.log" | grep -Eo '^[0-9]+' || true)"
          if grep -q 'ERR' "$RUNNER_TEMP/historique.log" || [ "${scannes:-0}" -eq 0 ]; then
            echo "::error::Scan de l'historique incomplet (erreur de gitleaks ou aucun commit scanné)"
            exit 1
          fi
      - name: Tout l'historique sans exclusion par nom de fichier
        run: |
          # gitleaks ignore par défaut certains noms (SVG, images, lockfiles, bootstrap*.js…) :
          # passé par l'entrée standard, tout le contenu est lu. Seul skills-lock.json est
          # retiré (empreintes SHA-256), il est scanné à l'étape précédente avec son exception étroite.
          git log -p --text --no-ext-diff --no-textconv --all --full-history \
            --diff-merges=first-parent -- . ':(exclude).claude/skills/skills-lock.json' \
            > "$RUNNER_TEMP/historique.diff"
          gitleaks stdin --redact --no-banner --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks/config.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks" < "$RUNNER_TEMP/historique.diff"

  dependances:
    name: Dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Aucune vulnérabilité, tous niveaux confondus
        run: npm audit --audit-level=low
      - name: Signatures du registre npm
        run: npm audit signatures

  codeql:
    name: Analyse CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
