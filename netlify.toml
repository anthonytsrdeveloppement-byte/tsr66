# Compilation du site chez Netlify (PRD 6.1). Ce fichier prime sur les réglages
# de l'interface Netlify. Jamais de secret ici : le dépôt est public (PRD 6.3).
# Version de Node : lue par Netlify dans .nvmrc.

[build]
  # Réinstallation à l'identique du fichier de verrouillage (checklist D4),
  # scripts d'installation bloqués par .npmrc, puis compilation.
  command = "npm ci && ./node_modules/.bin/next build"
  publish = ".next"

# Mise en ligne (branche production, une fois par lot, PRD 6.1) : seul un commit
# déjà fusionné dans main est compilé, sinon échec sans rien publier (C04).
[context.production]
  command = "node scripts/garde-production.mjs && npm ci && ./node_modules/.bin/next build"

[build.environment]
  # Télémétrie de Next.js désactivée (PRD 6.2).
  NEXT_TELEMETRY_DISABLED = "1"
  # Même version de npm que le projet (package.json, packageManager).
  NPM_VERSION = "11.19.0"

# Module Netlify pour Next.js, version figée dans package.json (PRD 2.1,
# décision de Nicolas du 2026-09-28) : Netlify ne choisit pas la version.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# En-têtes des fichiers servis directement par Netlify (/_next/static, public/).
# Les pages reçoivent ceux de next.config.ts : Netlify n'applique pas cette règle
# aux réponses de Next.js. Valeurs identiques à next.config.ts, vérifié par
# scripts/verifier-entetes.mjs (PRD 6.3, contrôle C06).
# X-Robots-Tag sans condition : Netlify ne distingue pas les contextes ici.
# À revoir à la mise en ligne de tsr66.fr (Lot 5, contrôle C60).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
